name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Mozilla lint
        run: npm run lint
      - name: Package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-bookmark-manager
          path: web-ext-artifacts/*.zip

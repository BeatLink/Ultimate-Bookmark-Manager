<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Manager</title>
  <link rel="icon" href="../../icons/icon.svg">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand"><img src="../../icons/icon.svg" alt="" width="24" height="24"> Bookmark Manager</div>
      <nav id="nav" aria-label="Views"></nav>
      <div class="compact-nav">
        <select id="nav-select" aria-label="View"></select>
        <button id="open-tab" class="small" title="Open in a tab">⤢</button>
      </div>
    </aside>
    <main id="main" tabindex="-1"><p class="muted">Loading bookmarks…</p></main>
  </div>
  <div id="stale" class="stale" role="status" hidden>
    Bookmarks changed outside this page. <button id="stale-refresh" class="small primary">Rescan</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
